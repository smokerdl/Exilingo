name: Apply config path fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch config manager
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("core/config_manager.py")
          text = path.read_text(encoding="utf-8")

          old = 'CONFIG_FILE = "config.json"'
          new = 'PROJECT_ROOT = Path(__file__).resolve().parent.parent\nCONFIG_FILE = PROJECT_ROOT / "config.json"'
          if old not in text:
              raise SystemExit("CONFIG_FILE pattern not found")
          text = text.replace(old, new, 1)

          old = '        filename: str = CONFIG_FILE,'
          new = '        filename: str | Path = CONFIG_FILE,'
          if old not in text:
              raise SystemExit("ConfigManager filename pattern not found")
          text = text.replace(old, new, 1)

          old = '''            self._merge_dict(\n                self.data,\n                loaded,\n            )\n\n            self._migrate_legacy_config(\n                loaded,\n            )\n\n            self._normalize_config()\n\n            self.save()\n'''
          new = '''            self._merge_dict(\n                self.data,\n                loaded,\n            )\n\n            before_migration_and_normalization = deepcopy(\n                self.data,\n            )\n\n            self._migrate_legacy_config(\n                loaded,\n            )\n\n            self._normalize_config()\n\n            if self.data != before_migration_and_normalization:\n                self.save()\n'''
          if old not in text:
              raise SystemExit("load() save pattern not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/config_manager.py
          git rm .github/workflows/_apply_config_path_fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: make config path stable and avoid unconditional save"
          git push