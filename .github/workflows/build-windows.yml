name: Build Windows test release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Exilingo
        shell: powershell
        run: .\build.ps1

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: Exilingo-test-windows
          path: dist/Exilingo
          if-no-files-found: error
